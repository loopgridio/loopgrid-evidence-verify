name: "LoopGrid Evidence Verify"
description: "Verify LoopGrid evidence bundles in CI and fail on tampering, broken chains, or signer mismatch."
author: "LoopGrid"

branding:
  icon: "shield"
  color: "blue"

inputs:
  evidence:
    description: "Path to the LoopGrid evidence bundle (.zip)"
    required: true

  expected-key-id:
    description: "Optional expected LoopGrid signer key id, for example ed25519:abc123..."
    required: false
    default: ""

  trusted-public-key:
    description: "Optional path to an out-of-band trusted PEM public key"
    required: false
    default: ""

  tsa-ca-file:
    description: "Optional trusted CA bundle for RFC3161 timestamp signer validation"
    required: false
    default: ""

outputs:
  result:
    description: "VERIFIED when verification succeeds"
    value: ${{ steps.verify.outputs.result }}

runs:
  using: "composite"
  steps:
    - name: Install canonical LoopGrid verifier
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check -q "loopgrid-verify==0.1.0"

    - name: Verify LoopGrid evidence
      id: verify
      shell: bash
      env:
        INPUT_EVIDENCE: ${{ inputs.evidence }}
        INPUT_EXPECTED_KEY_ID: ${{ inputs.expected-key-id }}
        INPUT_TRUSTED_PUBLIC_KEY: ${{ inputs.trusted-public-key }}
        INPUT_TSA_CA_FILE: ${{ inputs.tsa-ca-file }}
      run: |
        set -euo pipefail

        if [ ! -f "$INPUT_EVIDENCE" ]; then
          echo "::error::Evidence bundle not found: $INPUT_EVIDENCE"
          exit 2
        fi

        args=("$INPUT_EVIDENCE")

        if [ -n "$INPUT_EXPECTED_KEY_ID" ]; then
          args+=(--expected-key-id "$INPUT_EXPECTED_KEY_ID")
        fi

        if [ -n "$INPUT_TRUSTED_PUBLIC_KEY" ]; then
          args+=(--trusted-public-key "$INPUT_TRUSTED_PUBLIC_KEY")
        fi

        if [ -n "$INPUT_TSA_CA_FILE" ]; then
          args+=(--tsa-ca-file "$INPUT_TSA_CA_FILE")
        fi

        loopgrid-verify "${args[@]}"

        echo "result=VERIFIED" >> "$GITHUB_OUTPUT"
